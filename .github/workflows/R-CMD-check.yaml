on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ggplot2 ${{ matrix.config.ggplot2 }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release', ggplot2: 'latest'}
          - {os: ubuntu-latest, r: 'release', ggplot2: '3.4.4'}
          - {os: ubuntu-latest, r: 'month-old', ggplot2: 'latest'}
          - {os: macos-latest, r: 'release', ggplot2: 'latest'}
          - {os: windows-latest, r: 'release', ggplot2: 'latest'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      PARADOXR_REQUIRE_BIOC: ${{ matrix.config.ggplot2 == 'latest' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - name: Find the R release and CRAN snapshot from 30 days ago
        id: month-old
        if: matrix.config.r == 'month-old'
        shell: bash
        run: |
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%d)
          version=$(curl -fsSL https://cloud.r-project.org/src/base/R-4/ | grep -oE 'R-4\.[0-9]+\.[0-9]+\.tar\.gz</a> +[0-9]{4}-[0-9]{2}-[0-9]{2}' | awk -v cutoff="$cutoff" '{ sub(/\.tar\.gz<\/a>/, "", $1); sub(/^R-/, "", $1); if ($2 <= cutoff) print $1 }' | sort -V | tail -n 1)
          test -n "$version"
          echo "r=$version" >> "$GITHUB_OUTPUT"
          echo "cutoff=$cutoff" >> "$GITHUB_OUTPUT"
          echo "R $version, CRAN snapshot $cutoff"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.month-old.outputs.r || matrix.config.r }}
          use-public-rspm: true

      - name: Use the CRAN snapshot from 30 days ago
        if: matrix.config.r == 'month-old'
        shell: bash
        run: |
          echo "options(repos = c(CRAN = \"https://packagemanager.posit.co/cran/__linux__/$(lsb_release -cs)/${{ steps.month-old.outputs.cutoff }}\"))" | sudo tee -a "$(R RHOME)/etc/Rprofile.site"
          Rscript -e 'getOption("repos")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.ggplot2 != 'latest' && '"hard"' || '"all"' }}
          extra-packages: |
            any::rcmdcheck
            any::testthat
            ${{ matrix.config.ggplot2 != 'latest' && format('ggplot2@{0}', matrix.config.ggplot2) || '' }}
          needs: check
          cache-version: 2

      - name: Install the Bioconductor packages with BiocManager on Windows
        if: runner.os == 'Windows' && matrix.config.ggplot2 == 'latest'
        shell: Rscript {0}
        run: |
          utils::install.packages("BiocManager")
          print(BiocManager::version())
          BiocManager::install(c("clusterProfiler", "DOSE", "enrichplot", "GOSemSim", "AnnotationDbi", "GO.db", "org.Hs.eg.db", "DESeq2", "sva", "DiffBind", "Rsamtools", "csaw", "GenomicAlignments", "ChIPseeker", "EnrichedHeatmap", "TxDb.Hsapiens.UCSC.hg19.knownGene", "GSVA", "apeglm"), ask = FALSE, update = TRUE, force = TRUE)
          print(utils::packageVersion("clusterProfiler"))
          print(utils::packageVersion("DOSE"))
          print(BiocManager::valid())

      - name: Load the Bioconductor packages
        if: matrix.config.ggplot2 == 'latest'
        shell: Rscript {0}
        run: |
          pkgs <- c("AnnotationDbi", "DBI", "GO.db", "GOSemSim", "clusterProfiler", "org.Hs.eg.db", "DESeq2", "S4Vectors", "SummarizedExperiment", "sva", "DiffBind", "Rsamtools", "Seurat", "Signac", "csaw", "GenomicAlignments", "ChIPseeker", "EnrichedHeatmap", "TxDb.Hsapiens.UCSC.hg19.knownGene", "GSVA")
          failed <- Filter(\(p) inherits(try(loadNamespace(p)), "try-error"), pkgs)
          if (length(failed) > 0) stop("cannot load: ", paste(failed, collapse = ", "))

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  install:
    runs-on: ubuntu-latest

    name: Install from GitHub and draw the README examples

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install with pak
        shell: Rscript {0}
        run: |
          install.packages("pak")
          pak::pak("${{ github.repository }}@${{ github.event.pull_request.head.sha || github.sha }}")

      - name: Draw the README examples
        shell: Rscript {0}
        run: |
          readme <- readLines("README.md")
          open <- which(readme == "```r")
          close <- which(readme == "```")
          blocks <- lapply(open, \(i) readme[(i + 1):(min(close[close > i]) - 1)])
          blocks <- Filter(\(b) !any(grepl("pak::pak", b, fixed = TRUE)), blocks)
          needs <- \(b) unique(unlist(regmatches(b, gregexpr("[A-Za-z][A-Za-z0-9.]*(?=::)", b, perl = TRUE))))
          blocks <- Filter(\(b) all(vapply(needs(b), requireNamespace, logical(1), quietly = TRUE)), blocks)
          stopifnot(length(blocks) > 0)
          file <- tempfile(fileext = ".png")
          grDevices::png(file, width = 800, height = 600, type = "cairo")
          for (b in blocks) {
            for (e in parse(text = b)) {
              r <- withVisible(eval(e, globalenv()))
              if (r$visible) print(r$value)
            }
          }
          grDevices::dev.off()
          stopifnot(file.size(file) > 0)

  version:
    runs-on: ubuntu-latest

    name: Check that package changes increase the version

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the DESCRIPTION version with the previous commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No previous commit to compare with"
            exit 0
          fi
          if git diff --quiet "$BASE" HEAD -- R NAMESPACE DESCRIPTION inst data man; then
            echo "No package files changed"
            exit 0
          fi
          old=$(git show "$BASE:DESCRIPTION" | sed -n 's/^Version: *//p')
          new=$(sed -n 's/^Version: *//p' DESCRIPTION)
          echo "Version $old -> $new"
          if [ "$old" = "$new" ] || [ "$(printf '%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
            echo "::error file=DESCRIPTION::Package files changed, so the version must increase (was $old, now $new)"
            exit 1
          fi
