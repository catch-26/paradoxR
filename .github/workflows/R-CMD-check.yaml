on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ggplot2 ${{ matrix.config.ggplot2 }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release', ggplot2: 'latest'}
          - {os: ubuntu-latest, r: 'release', ggplot2: '3.4.4'}
          - {os: macos-latest, r: 'release', ggplot2: 'latest'}
          - {os: windows-latest, r: 'release', ggplot2: 'latest'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.ggplot2 != 'latest' && format('ggplot2@{0}', matrix.config.ggplot2) || '' }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  install:
    runs-on: ubuntu-latest

    name: Install from GitHub and draw the README examples

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install with pak
        shell: Rscript {0}
        run: |
          install.packages("pak")
          pak::pak("${{ github.repository }}@${{ github.event.pull_request.head.sha || github.sha }}")

      - name: Draw the README examples
        shell: Rscript {0}
        run: |
          readme <- readLines("README.md")
          open <- which(readme == "```r")
          close <- which(readme == "```")
          blocks <- lapply(open, \(i) readme[(i + 1):(min(close[close > i]) - 1)])
          blocks <- Filter(\(b) !any(grepl("pak::pak", b, fixed = TRUE)), blocks)
          stopifnot(length(blocks) > 0)
          file <- tempfile(fileext = ".png")
          grDevices::png(file, width = 800, height = 600, type = "cairo")
          for (b in blocks) {
            for (e in parse(text = b)) {
              r <- withVisible(eval(e, globalenv()))
              if (r$visible) print(r$value)
            }
          }
          grDevices::dev.off()
          stopifnot(file.size(file) > 0)
